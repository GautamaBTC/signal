<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <filter id="pulse-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer pulse rings -->
  <circle cx="30" cy="30" r="26" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0">
    <animate attributeName="r" values="10;28" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="30" cy="30" r="20" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0">
    <animate attributeName="r" values="10;28" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="stroke-opacity" values="0.8;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- Inner ring -->
  <circle cx="30" cy="30" r="10" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.6" filter="url(#pulse-glow)"/>

  <!-- Center dot -->
  <circle cx="30" cy="30" r="4" fill="#00E5FF" filter="url(#pulse-glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Signal waves arcs -->
  <path d="M 20 22 A 14 14 0 0 1 40 22" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" filter="url(#pulse-glow)">
    <animate attributeName="stroke-opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 14 16 A 20 20 0 0 1 46 16" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" filter="url(#pulse-glow)">
    <animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
  </path>
  <path d="M 8 10 A 26 26 0 0 1 52 10" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.2" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.2;0.05;0.2" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
  </path>

  <!-- Online dot indicator -->
  <circle cx="30" cy="30" r="3" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
