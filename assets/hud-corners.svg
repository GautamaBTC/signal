<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" preserveAspectRatio="none">
  <defs>
    <filter id="corner-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- TOP LEFT CORNER -->
  <g filter="url(#corner-glow)" stroke="#00E5FF" fill="none">
    <!-- Main L bracket -->
    <path d="M 0 60 L 0 8 Q 0 0 8 0 L 60 0" stroke-width="1.5" stroke-opacity="0.9"/>
    <!-- Inner accent -->
    <path d="M 0 45 L 0 16 Q 0 8 8 8 L 45 8" stroke-width="0.5" stroke-opacity="0.4"/>
    <!-- Corner dot -->
    <circle cx="4" cy="4" r="2" fill="#00E5FF" stroke="none" opacity="0.8"/>
    <!-- Horizontal tick marks -->
    <line x1="70" y1="0" x2="85" y2="0" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="95" y1="0" x2="105" y2="0" stroke-width="0.5" stroke-opacity="0.3"/>
    <!-- Vertical tick marks -->
    <line x1="0" y1="70" x2="0" y2="85" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="0" y1="95" x2="0" y2="105" stroke-width="0.5" stroke-opacity="0.3"/>
    <!-- Small markers -->
    <rect x="12" y="0" width="4" height="1" fill="#00E5FF" opacity="0.6"/>
    <rect x="0" y="12" width="1" height="4" fill="#00E5FF" opacity="0.6"/>
    <rect x="20" y="0" width="2" height="1" fill="#00E5FF" opacity="0.4"/>
    <rect x="0" y="20" width="1" height="2" fill="#00E5FF" opacity="0.4"/>
    <!-- Technical label -->
    <text x="16" y="-4" font-family="monospace" font-size="6" fill="#00E5FF" opacity="0.5" transform="rotate(0)">SIG</text>
  </g>

  <!-- TOP RIGHT CORNER -->
  <g transform="translate(390, 0)" filter="url(#corner-glow)" stroke="#00E5FF" fill="none">
    <path d="M 0 0 L -8 0 Q -0 0 0 8 L 0 60" stroke-width="1.5" stroke-opacity="0.9" transform="scale(-1,1)"/>
    <path d="M -60 0 L -8 0 Q 0 0 0 8 L 0 60" stroke-width="1.5" stroke-opacity="0.9"/>
    <path d="M -45 8 L -8 8 Q 0 8 0 16 L 0 45" stroke-width="0.5" stroke-opacity="0.4"/>
    <circle cx="-4" cy="4" r="2" fill="#00E5FF" stroke="none" opacity="0.8"/>
    <line x1="-70" y1="0" x2="-85" y2="0" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="-95" y1="0" x2="-105" y2="0" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="0" y1="70" x2="0" y2="85" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="-16" y="0" width="4" height="1" fill="#00E5FF" opacity="0.6"/>
    <rect x="-1" y="12" width="1" height="4" fill="#00E5FF" opacity="0.6"/>
  </g>

  <!-- BOTTOM LEFT CORNER -->
  <g transform="translate(0, 844)" filter="url(#corner-glow)" stroke="#00E5FF" fill="none">
    <path d="M 0 -60 L 0 -8 Q 0 0 8 0 L 60 0" stroke-width="1.5" stroke-opacity="0.9"/>
    <path d="M 0 -45 L 0 -8 Q 0 0 8 0 L 45 0" stroke-width="0.5" stroke-opacity="0.4" transform="translate(8,-8)"/>
    <circle cx="4" cy="-4" r="2" fill="#00E5FF" stroke="none" opacity="0.8"/>
    <line x1="70" y1="0" x2="85" y2="0" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="0" y1="-70" x2="0" y2="-85" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="0" y1="-95" x2="0" y2="-105" stroke-width="0.5" stroke-opacity="0.3"/>
    <rect x="12" y="-1" width="4" height="1" fill="#00E5FF" opacity="0.6"/>
    <rect x="0" y="-16" width="1" height="4" fill="#00E5FF" opacity="0.6"/>
    <text x="8" y="-8" font-family="monospace" font-size="6" fill="#00E5FF" opacity="0.5">PWR</text>
  </g>

  <!-- BOTTOM RIGHT CORNER -->
  <g transform="translate(390, 844)" filter="url(#corner-glow)" stroke="#00E5FF" fill="none">
    <path d="M -60 0 L -8 0 Q 0 0 0 -8 L 0 -60" stroke-width="1.5" stroke-opacity="0.9"/>
    <path d="M -45 0 L -8 0 Q 0 0 0 -8 L 0 -45" stroke-width="0.5" stroke-opacity="0.4" transform="translate(-8,8)"/>
    <circle cx="-4" cy="-4" r="2" fill="#00E5FF" stroke="none" opacity="0.8"/>
    <line x1="-70" y1="0" x2="-85" y2="0" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="0" y1="-70" x2="0" y2="-85" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="-16" y="-1" width="4" height="1" fill="#00E5FF" opacity="0.6"/>
    <rect x="-1" y="-16" width="1" height="4" fill="#00E5FF" opacity="0.6"/>
  </g>

  <!-- CENTER horizontal lines -->
  <line x1="0" y1="422" x2="20" y2="422" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.3" filter="url(#corner-glow)"/>
  <line x1="370" y1="422" x2="390" y2="422" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.3" filter="url(#corner-glow)"/>

  <!-- Side micro ticks left -->
  <g stroke="#00E5FF" stroke-opacity="0.2" stroke-width="0.5">
    <line x1="0" y1="200" x2="6" y2="200"/>
    <line x1="0" y1="210" x2="4" y2="210"/>
    <line x1="0" y1="220" x2="4" y2="220"/>
    <line x1="0" y1="230" x2="6" y2="230"/>
    <line x1="0" y1="600" x2="6" y2="600"/>
    <line x1="0" y1="610" x2="4" y2="610"/>
    <line x1="0" y1="620" x2="4" y2="620"/>
    <line x1="0" y1="630" x2="6" y2="630"/>
  </g>
  <!-- Side micro ticks right -->
  <g stroke="#00E5FF" stroke-opacity="0.2" stroke-width="0.5">
    <line x1="384" y1="200" x2="390" y2="200"/>
    <line x1="386" y1="210" x2="390" y2="210"/>
    <line x1="386" y1="220" x2="390" y2="220"/>
    <line x1="384" y1="230" x2="390" y2="230"/>
    <line x1="384" y1="600" x2="390" y2="600"/>
    <line x1="386" y1="610" x2="390" y2="610"/>
    <line x1="386" y1="620" x2="390" y2="620"/>
    <line x1="384" y1="630" x2="390" y2="630"/>
  </g>
</svg>
